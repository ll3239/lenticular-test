<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Three-axis volumetric rod photo cube — 3D</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      background: #12141a; color: #e8eaef; height: 100vh; display: flex; flex-direction: column;
    }
    header {
      padding: 12px 16px; border-bottom: 1px solid #2a2e38;
      display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between;
    }
    header h1 { font-size: 15px; font-weight: 600; }
    header p { font-size: 12px; color: #8b92a3; margin-top: 4px; }
    .links { display: flex; gap: 8px; flex-wrap: wrap; }
    a.btn, button {
      background: #3d6dd4; color: #fff; border: none; text-decoration: none;
      padding: 8px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer;
    }
    a.btn.secondary, button.secondary { background: #2a3348; }
    main { flex: 1; display: grid; grid-template-columns: 1fr 280px; min-height: 0; }
    #viewport { position: relative; background: linear-gradient(#2a2e38, #1a1d24); min-height: 0; }
    #canvas-container { width: 100%; height: 100%; touch-action: none; }
    #label {
      position: absolute; top: 12px; left: 12px;
      background: rgba(0,0,0,0.75); padding: 10px 14px; border-radius: 10px; font-size: 13px;
      backdrop-filter: blur(6px); line-height: 1.45;
    }
    aside {
      border-left: 1px solid #2a2e38; padding: 14px; overflow-y: auto;
      display: flex; flex-direction: column; gap: 10px; font-size: 12px; color: #9aa3b5;
    }
    aside h2 { font-size: 13px; color: #e8eaef; margin-bottom: 4px; }
    aside img { width: 100%; border-radius: 8px; border: 1px solid #2a3040; }
    aside a { color: #6b9fff; word-break: break-all; }
    .hint { line-height: 1.5; }
    code { color: #8cf; font-size: 11px; }
    @media (max-width: 768px) {
      main { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
      aside { border-left: none; border-top: 1px solid #2a2e38; max-height: 34dvh; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Three-axis rod-network photo cube · 50 mm</h1>
      <p>整个体积是连通线材网络；X / Y / Z 各编码一张照片</p>
    </div>
    <div class="links">
      <button id="reset" class="secondary">重置视角</button>
      <a class="btn secondary" href="../download/three_axis_rod_network.stl">下载 STL</a>
      <a class="btn secondary" href="../download/three_axis_rod_network_package.zip">下载 ZIP</a>
    </div>
  </header>
  <main>
    <div id="viewport">
      <div id="canvas-container"></div>
      <div id="label">Loading model…</div>
    </div>
    <aside>
      <h2>验证报告</h2>
      <p class="hint">验证由实际 STL 重建占用体素并测量三个正交投影。</p>
      <a href="../output/THREE_AXIS_ROD_NETWORK_VALIDATION.md">THREE_AXIS_ROD_NETWORK_VALIDATION.md</a>
      <h2>X 轴投影验证</h2>
      <img src="../output/three_axis_rod_network_projections/axis_x.png" alt="X axis validation" />
      <p class="hint">本地预览：<code>http://localhost:8766/viewer/photo_cube.html</code></p>
    </aside>
  </main>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { STLLoader } from 'three/addons/loaders/STLLoader.js';

    const SIZE = 50;
    const CENTER = SIZE / 2;
    const CACHE = '20260816-three-axis-rods-v1';
    const RAW = 'https://raw.githubusercontent.com/ll3239/lenticular-test/cursor/entryway-storage-box-597e/output';
    const STL_PATHS = [
      `/output/three_axis_rod_network.stl?v=${CACHE}`,
      `../output/three_axis_rod_network.stl?v=${CACHE}`,
      `${RAW}/three_axis_rod_network.stl?v=${CACHE}`,
    ];

    const container = document.getElementById('canvas-container');
    const label = document.getElementById('label');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1d24);

    const camera = new THREE.PerspectiveCamera(45, 1, 0.5, 500);
    camera.position.set(90, 70, 95);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(CENTER, CENTER, CENTER);
    controls.enableDamping = true;

    scene.add(new THREE.AmbientLight(0xffffff, 0.45));
    const key = new THREE.DirectionalLight(0xffffff, 1.0);
    key.position.set(-60, 80, 70);
    scene.add(key);
    const fill = new THREE.DirectionalLight(0xaaccff, 0.35);
    fill.position.set(80, 20, -40);
    scene.add(fill);

    const grid = new THREE.GridHelper(80, 16, 0x3a4050, 0x252830);
    grid.position.set(CENTER, 0, CENTER);
    scene.add(grid);

    const loader = new STLLoader();
    let mesh = null;

    function resize() {
      const w = container.clientWidth;
      const h = container.clientHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h, false);
    }

    function loadNext(index = 0) {
      if (index >= STL_PATHS.length) {
        label.textContent = '模型加载失败 — 请检查网络或使用本地 serve_preview.sh';
        return;
      }
      loader.load(
        STL_PATHS[index],
        (geo) => {
          geo.computeVertexNormals();
          geo.center();
          geo.translate(CENTER, CENTER, CENTER);
          if (mesh) scene.remove(mesh);
          mesh = new THREE.Mesh(
            geo,
            new THREE.MeshStandardMaterial({
              color: 0xd8d2c8,
              metalness: 0.05,
              roughness: 0.78,
            }),
          );
          scene.add(mesh);
          label.innerHTML = '50 × 50 × 50 mm<br>30% 材料 / 70% 空隙 · 体积线材网络';
        },
        undefined,
        () => loadNext(index + 1),
      );
    }

    document.getElementById('reset').addEventListener('click', () => {
      camera.position.set(90, 70, 95);
      controls.target.set(CENTER, CENTER, CENTER);
      controls.update();
    });

    resize();
    window.addEventListener('resize', resize);
    loadNext();
    (function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    })();
  </script>
</body>
</html>
