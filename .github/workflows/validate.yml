name: Validate printable models

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify entryway dimensions
        run: python scripts/verify_entryway_dimensions.py

      - name: Check entryway fit and bed size
        run: python scripts/check_entryway_fit.py

      - name: Validate three-axis rod network
        run: python scripts/validate_three_axis_rod_network.py

      - name: Validate connected depth cube
        run: |
          python scripts/validate_connected_depth_cube.py \
            --mesh output/cube_connected_depth.stl \
            --images images/complex/01_photo.png images/complex/02_photo.png \
                     images/complex/03_photo.png images/complex/04_photo.png \
                     images/complex/05_photo.png images/complex/06_photo.png \
            --preview-dir output/cube_connected_depth_previews \
            --report-json output/cube_connected_depth_validation.json \
            --report-md output/CUBE_CONNECTED_DEPTH_VALIDATION.md
